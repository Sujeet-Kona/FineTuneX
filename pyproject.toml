[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finetunex"
version = "0.1.0"
description = "A reproducible LLM fine-tuning and evaluation pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "datasets>=3.3,<5.0",
    "huggingface-hub>=0.27,<2.0",
    "scikit-learn>=1.5,<2.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.6,<3.0",
    "transformers>=4.51.1,<5.0",
    "peft>=0.15,<1.0",
    "accelerate>=1.5,<2.0",
    "safetensors>=0.5,<1.0",
]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
