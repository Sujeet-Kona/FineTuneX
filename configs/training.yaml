training:
  method: lora
  seed: 42
  epochs: 2
  learning_rate: 0.0002
  batch_size: 1
  gradient_accumulation_steps: 8
  max_sequence_length: 1536
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false
  lora:
    rank: 8
    alpha: 16
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
  output_dir: artifacts/checkpoints
