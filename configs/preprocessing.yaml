  input:
    directory: data/processed/finqa

  output:
    directory: artifacts/preprocessed/finqa

  evidence:
    strategy: complete-table-first
    token_budget: 1024

  sequence:
    max_length: 1536
    max_prompt_length: 1408

  generation:
    max_new_tokens: 128

  splits:
    - train
    - validation

  expected_counts:
    train: 6251
    validation: 883
